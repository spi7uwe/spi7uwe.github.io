<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secwepemctsín</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: #fff;
    }

    /* Background */
    .bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.55)),
        url("images/home-hero.png") center / cover no-repeat;
      z-index: -2;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(0,0,0,.15) 0%, rgba(0,0,0,.8) 70%);
      z-index: -1;
    }

    /* Layout */
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 18px 90px;
      text-align: center;
    }

    .hero {
      max-width: 900px;
      width: 100%;
    }

    h1 {
      font-size: clamp(34px, 6vw, 72px);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      text-shadow: 0 10px 40px rgba(0,0,0,.6);
    }

    .dash {
      margin: 0 .15em;
      opacity: .8;
    }

    .sq {
      margin-top: 14px;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: 600;
      opacity: .95;
    }

    .en {
      margin-top: 6px;
      font-size: 16px;
      opacity: .75;
    }

    /* Buttons */
    .nav {
      margin-top: 26px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
      transition: all .15s ease;
      font-weight: 600;
    }

    .nav a:hover {
      border-color: rgba(255,255,255,.5);
      transform: translateY(-1px);
    }

    /* Footer text */
    .territory {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      opacity: .6;
    }

    /* Mobile fixes */
    @media (max-width: 600px) {
      h1 {
        font-size: 32px;
      }
      .sq {
        font-size: 18px;
      }
      .nav {
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="vignette"></div>

  <div class="wrap">
    <div class="hero">

      <h1>
        Secwepemctsném<span class="dash">—</span>kt
      </h1>

      <div class="sq">wel me7 yews</div>
      <div class="en">We speak Secwepemctsín forever.</div>

      <div class="nav">
        <a href="about.html">About</a>
        <a href="lessons.html">Lessons</a>
        <a href="glossary.html">Glossary</a>
      </div>

    </div>
  </div>

  <div class="territory">Ne Secwepemcúl̓ecw</div>

</body>
</html>
