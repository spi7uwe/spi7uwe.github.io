<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secwepemctsín</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }

    body{
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #f5f5f5;
      background: #000;
      overflow-x: hidden;
    }

    /* Background image */
    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 40%, rgba(0,0,0,0.20), rgba(0,0,0,0.85) 70%),
        linear-gradient(180deg, rgba(0,0,0,0.30), rgba(0,0,0,0.92)),
        url("images/home.jpg");
      background-size: cover;
      background-position: center;
      filter: saturate(1.05) contrast(1.06);
      transform: scale(1.02);
      z-index: -2;
    }

    /* Soft glow vignette */
    .vignette{
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,0.06), transparent 55%);
      z-index: -1;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .hero{
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px 90px;
      text-align: center;
    }

    .stack{
      width: min(980px, 100%);
      padding: 34px 22px;
      border-radius: 26px;
      background: rgba(0,0,0,0.40);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 90px rgba(0,0,0,0.55);
    }

    /* MAIN TITLE */
    .title{
      margin: 0;
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.02em;
      font-size: clamp(40px, 7vw, 84px);
      text-shadow: 0 10px 40px rgba(0,0,0,0.65);
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px; /* controls closeness between parts */
    }

    .title .dash{
      font-weight: 600;
      opacity: 0.85;
      font-size: 0.70em;  /* SMALL dash */
      transform: translateY(-0.02em);
    }

    .title .kt{
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-left: -2px; /* pulls kt closer */
    }

    /* SUBTITLE: wel me7 yews */
    .subline{
      margin: 14px 0 10px;
      font-size: clamp(20px, 3.2vw, 30px); /* BIGGER */
      font-weight: 700;
      opacity: 0.95;
      letter-spacing: -0.01em;
      text-shadow: 0 8px 30px rgba(0,0,0,0.65);
    }

    .english{
      margin: 0 0 22px;
      font-weight: 300;
      font-size: clamp(14px, 2.3vw, 18px);
      opacity: 0.78;
    }

    /* Buttons */
    .nav{
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .nav a{
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .nav a:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.30);
      background: rgba(255,255,255,0.10);
    }

    /* Bottom territory line */
    .territory{
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      font-size: 13px;
      opacity: 0.55;
      letter-spacing: 0.02em;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(8px);
      pointer-events: none;
      white-space: nowrap;
    }

    /* Mobile tweaks */
    @media (max-width: 480px){
      .stack{ padding: 26px 16px; border-radius: 22px; }
      .title{ gap: 8px; }
      .nav a{ padding: 10px 14px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="vignette"></div>

  <main class="hero">
    <section class="stack">
      <!-- FIXED ACCENTS: use precomposed characters (é, í) -->
      <h1 class="title">
        <span>Secwepemctsném</span>
        <span class="dash">—</span>
        <span class="kt">kt</span>
      </h1>

      <div class="subline">wel me7 yews</div>
      <p class="english">We speak Secwepemctsín forever.</p>

      <nav class="nav" aria-label="Primary navigation">
        <a href="about.html">About</a>
        <a href="lessons.html">Lessons</a>
        <a href="glossary.html">Glossary</a>
      </nav>
    </section>
  </main>

  <div class="territory">Ne Secwepemcúl̓ecw</div>
</body>
</html>
