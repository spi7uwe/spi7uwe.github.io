<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secwepemctsín</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #f5f5f5;
      min-height: 100vh;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      animation: fadeIn 1.2s ease-out;
    }

    /* Background image */
    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background-image: url("images/home-hero.png"); /* <-- your file here */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.03);
      filter: saturate(1.05) contrast(1.05);
    }

    /* Dark overlay for readability */
    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 25%, rgba(0,0,0,0.25), rgba(0,0,0,0.80) 70%),
        linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.78));
    }

    /* Content layer above background */
    .content{
      position: relative;
      z-index: 2;
      max-width: 900px;
      width: 100%;
      padding: 1rem;
    }

    h1 {
      margin: 0;
      font-weight: 800;
      letter-spacing: 0.02em;

      /* key fix: smaller on phones, bigger on desktop */
      font-size: clamp(1.8rem, 6vw, 3.6rem);
      line-height: 1.08;

      text-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }

    h2 {
      margin: 1rem 0 0;
      font-size: clamp(1rem, 3.2vw, 1.25rem);
      font-weight: 300;
      opacity: 0.88;
      text-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }

    /* Territory line */
    .territory {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      opacity: 0.75;
      white-space: nowrap;
      pointer-events: none;
      z-index: 2;
      text-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }

    /* Nav buttons */
    .nav {
      margin-top: 1.8rem;
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav a {
      color: #f5f5f5;
      text-decoration: none;
      font-size: 0.95rem;
      opacity: 0.92;
      padding: 0.65rem 1rem;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.25);
      transition: opacity 0.15s ease, border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
    }

    .nav a:hover {
      opacity: 1;
      border-color: rgba(255,255,255,0.32);
      background: rgba(0,0,0,0.35);
      transform: translateY(-1px);
    }

    .nav a:active {
      transform: translateY(0px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Phone-specific tweaks */
    @media (max-width: 480px) {
      .hero { padding: 1.25rem; }
      .nav a { width: 100%; max-width: 280px; }
    }
  </style>
</head>

<body>
  <div class="hero">
    <div class="content">
      <h1>Secwepemctsném kt wel me7 yews!</h1>
      <h2>We speak Secwepemctsín forever.</h2>

      <div class="nav">
        <a href="about.html">About</a>
        <a href="lessons.html">Lessons</a>
        <a href="glossary.html">Glossary</a>
      </div>
    </div>

    <div class="territory">Ne Secwepemcúl̓ecw</div>
  </div>
</body>
</html>
