<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Secwepemctsín</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon (put favicon.png at repo ROOT, same level as index.html) -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{
      font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:#fff;
      overflow-x:hidden;
      background:#000;
    }

    /* BACKGROUND IMAGE */
    .bg{
      position:fixed;
      inset:0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,.55) 45%, rgba(0,0,0,.80)),
        url("./images/home-hero.png");
;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.02);
      z-index:-2;
    }

    /* Vignette so text pops */
    .vignette{
      position:fixed;
      inset:0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.08) 0%, rgba(0,0,0,0.62) 70%, rgba(0,0,0,0.88) 100%);
      z-index:-1;
      pointer-events:none;
    }

    /* THIS is what centers everything (your current file is missing this) */
    .wrap{
      min-height: 100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 28px 18px 92px;
      text-align:center;
    }

    .wrap > .content{
      width: min(980px, 100%);
      animation: fadeUp 0.9s ease-out;
    }

    @keyframes fadeUp{
      from{ opacity:0; transform: translateY(14px); }
      to{ opacity:1; transform: translateY(0); }
    }

    .title{
      margin:0;
      font-weight:800;
      letter-spacing:-0.02em;
      line-height:1.02;
      font-size: clamp(34px, 7.2vw, 84px);
      text-shadow: 0 10px 40px rgba(0,0,0,.55);
      white-space: normal;
    }

    /* small/tight dash before kt */
    .dash{
      display:inline-block;
      font-weight:700;
      font-size: 0.62em;     /* makes the dash smaller than the title */
      opacity:.85;
      margin: 0 .18em;       /* tight spacing */
      transform: translateY(-0.08em);
    }

    .subtitle-sq{
      margin: 14px 0 8px;
      font-size: clamp(20px, 4.2vw, 34px); /* bigger “wel me7 yews” */
      font-weight:700;
      opacity:.97;
      letter-spacing:-0.01em;
      text-shadow: 0 8px 26px rgba(0,0,0,.55);
    }

    .subtitle-en{
      margin: 0 0 20px;
      font-size: clamp(15px, 2.6vw, 20px);
      font-weight:300;
      opacity:.80;
      text-shadow: 0 8px 26px rgba(0,0,0,.55);
    }

    .nav{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 8px;
    }

    .nav a{
      text-decoration:none;
      color:#fff;
      font-weight:700;
      font-size: 15px;
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(0,0,0,.18);
      backdrop-filter: blur(10px);
      transition: transform .12s ease, border-color .12s ease, background .12s ease, opacity .12s ease;
      opacity: .95;
      min-height: 44px;  /* phone-friendly tap size */
      display:flex;
      align-items:center;
    }

    .nav a:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.42);
      background: rgba(0,0,0,.30);
      opacity: 1;
    }

    .territory{
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      font-size: 13px;
      opacity: .58;
      letter-spacing: .02em;
      text-shadow: 0 6px 22px rgba(0,0,0,.55);
      white-space: nowrap;
      pointer-events:none;
    }

    /* Mobile tweaks */
    @media (max-width: 420px){
      .wrap{ padding-bottom: 112px; }
      .title{ font-size: clamp(30px, 9.2vw, 44px); }
      .subtitle-sq{ font-size: clamp(18px, 6.0vw, 26px); }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="vignette"></div>

  <div class="wrap">
    <div class="content">
      <h1 class="title">
        Secwepemctsném <span class="dash">—</span> kt
      </h1>

      <div class="subtitle-sq">wel me7 yews</div>
      <div class="subtitle-en">We speak Secwepemctsín forever.</div>

      <div class="nav">
        <a href="about.html">About</a>
        <a href="lessons.html">Lessons</a>
        <a href="glossary.html">Glossary</a>
      </div>
    </div>
  </div>

  <div class="territory">Ne Secwepemcúl̓ecw</div>
</body>
</html>
